name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 20 }
      - name: syntax — client (ES module) and server
        run: |
          node --input-type=module --check < www/app/client.js
          node --check serve.js
      - name: pinned key equals the published key file
        run: |
          test "$(grep -o "PINNED_PUBKEY_HEX='[0-9a-f]*'" www/app/client.js | cut -d"'" -f2)" = "$(cat keys/release_ed25519.pub.hex)"
      - name: no credentials committed (generic secret patterns only)
        run: |
          ! grep -rn -E "BEGIN (RSA|OPENSSH|EC|ED25519) PRIVATE KEY|ghp_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9_]{20}|AKIA[0-9A-Z]{16}|xox[bap]-[0-9A-Za-z-]{10}|-----BEGIN|sk-[A-Za-z0-9]{32}" . --exclude-dir=.git --exclude=ci.yml
      - name: execution tests (modules import and behave — a parse check is not a test)
        run: node test/run.mjs
      - name: manifest binding must hash real bytes, never a self-declared field
        run: |
          grep -q 'consts\["constants_sha256"\]' tools/make_manifest.py && { echo "make_manifest reads self-declared hash"; exit 1; } || true
          grep -q 'sha(_pc)' tools/make_manifest.py || { echo "make_manifest does not hash probe_constants.json bytes"; exit 1; }
      - name: python tooling compiles
        run: python3 -m py_compile tools/*.py
